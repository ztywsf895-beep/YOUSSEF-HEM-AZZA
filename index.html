<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Dashboard</title>
<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
    }

    .container {
        width: 90%;
        margin: 40px auto;
    }

    .title {
        margin-bottom: 25px;
    }

    .title h1 {
        margin: 0;
        font-size: 32px;
    }

    .title p {
        margin-top: 8px;
        color: #64748b;
    }

    .controls {
        background: white;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 25px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .search-box {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    #search {
        flex: 1;
        min-width: 220px;
        padding: 12px 15px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    #search:focus {
        border-color: #2563eb;
    }

    #city {
        padding: 12px 15px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        background: white;
        outline: none;
        cursor: pointer;
    }

    #city:focus {
        border-color: #2563eb;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: #dc2626;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #b91c1c;
    }

    .table-box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
    }

    th {
        background: #1e293b;
        color: white;
        padding: 15px;
        text-align: left;
    }

    td {
        padding: 14px 15px;
        border-bottom: 1px solid #e2e8f0;
    }

    tr:hover td {
        background: #f8fafc;
    }

    .salary {
        font-weight: bold;
    }

    .city-name {
        background: #e0f2fe;
        color: #0369a1;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 13px;
    }

    @media (max-width: 700px) {

        .container {
            width: 95%;
            margin: 20px auto;
        }

        .title h1 {
            font-size: 25px;
        }

        .search-box {
            flex-direction: column;
        }

        #search,
        #city,
        button {
            width: 100%;
        }
    }

</style>

</head>

<body>

<div class="container">

    <div class="title">
        <h1>Users Dashboard</h1>
        <p>Manage and search users easily</p>
    </div>

    <div class="controls">

        <div class="search-box">

            <input type="text" id="search" placeholder="Search by name...">

            <select id="city">
                <option value="">All Cities</option>
                <option value="Cairo">Cairo</option>
                <option value="Giza">Giza</option>
                <option value="Alexandria">Alexandria</option>
                <option value="Mansoura">Mansoura</option>
                <option value="Tanta">Tanta</option>
            </select>

            <button onclick="remove()">Remove > 10000</button>

        </div>

    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Salary</th>
                    <th>Address</th>
                    <th>City</th>
                </tr>
            </thead>

            <tbody id="table"></tbody>

        </table>

    </div>

</div>


<script>

    let users = [
        {id: 1, name: "Ahmed", email: "ahmed@gmail.com", salary: 1000, address: "Main Street", city: "Cairo"},
        {id: 2, name: "Ali", email: "ali@gmail.com", salary: 12000, address: "Nile Street", city: "Giza"},
        {id: 3, name: "Omar", email: "omar@gmail.com", salary: 13000, address: "Sea Street", city: "Alexandria"},
        {id: 4, name: "Youssef", email: "youssef@gmail.com", salary: 15000, address: "Station Street", city: "Mansoura"},
        {id: 5, name: "Mohamed", email: "mohamed@gmail.com", salary: 5000, address: "University Street", city: "Tanta"},

        {id: 6, name: "Hassan", email: "hassan@gmail.com", salary: 9000, address: "Nile Street", city: "Cairo"},
        {id: 7, name: "Mahmoud", email: "mahmoud@gmail.com", salary: 11000, address: "Haram Street", city: "Giza"},
        {id: 8, name: "Mostafa", email: "mostafa@gmail.com", salary: 7000, address: "Sea Street", city: "Alexandria"},
        {id: 9, name: "Khaled", email: "khaled@gmail.com", salary: 14000, address: "Gomhoria Street", city: "Mansoura"},
        {id: 10, name: "Ibrahim", email: "ibrahim@gmail.com", salary: 6000, address: "Station Street", city: "Tanta"},

        {id: 11, name: "Karim", email: "karim@gmail.com", salary: 16000, address: "Nasr Street", city: "Cairo"},
        {id: 12, name: "Amr", email: "amr@gmail.com", salary: 8000, address: "Nile Street", city: "Giza"},
        {id: 13, name: "Tarek", email: "tarek@gmail.com", salary: 10000, address: "Sea Street", city: "Alexandria"},
        {id: 14, name: "Adam", email: "adam@gmail.com", salary: 18000, address: "University Street", city: "Mansoura"},
        {id: 15, name: "Ziad", email: "ziad@gmail.com", salary: 4000, address: "Main Street", city: "Tanta"}
    ];


    function show(data) {

        document.getElementById("table").innerHTML = "";

        for (let i = 0; i < data.length; i++) {

            document.getElementById("table").innerHTML +=

                "<tr>" +

                "<td>" + data[i].id + "</td>" +

                "<td>" + data[i].name + "</td>" +

                "<td>" + data[i].email + "</td>" +

                "<td class='salary'>" + data[i].salary + "</td>" +

                "<td>" + data[i].address + "</td>" +

                "<td><span class='city-name'>" + data[i].city + "</span></td>" +

                "</tr>";
        }
    }


    function remove() {

        users = users.filter(function(user) {

            return user.salary <= 10000;

        });

        show(users);
    }


    document.getElementById("search").addEventListener("input", function() {

        let search = this.value.toLowerCase();

        let result = users.filter(function(user) {

            return user.name.toLowerCase().includes(search);

        });

        show(result);

    });


    document.getElementById("city").addEventListener("change", function() {

        let city = this.value;

        if (city == "") {

            show(users);

        } else {

            let result = users.filter(function(user) {

                return user.city == city;

            });

            show(result);
        }

    });


    show(users);

</script>

</body>

</html>
